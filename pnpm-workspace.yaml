ignoredBuiltDependencies:
  - es5-ext
  - fsevents
  - sharp

minimumReleaseAge: 4320

nodeLinker: isolated

onlyBuiltDependencies:
  - esbuild

overrides:
  # Keep Babel on the 7.x line: babel-jest@29 / @jest/transform@29 call
  # loadPartialConfig synchronously, which Babel 8 removed, so an unbounded
  # '>=7.29.6' that resolves to 8.x breaks the whole test transform.
  '@babel/core@<=7.29.0': '>=7.29.6 <8.0.0'
  '@babel/plugin-transform-modules-systemjs@>=7.12.0 <=7.29.3': '>=7.29.4 <8.0.0'
  basic-ftp@<5.2.0: '>=5.2.0'
  basic-ftp@<=5.2.1: '>=5.2.2'
  basic-ftp@<=5.2.2: '>=5.3.0'
  basic-ftp@<=5.3.0: '>=5.3.1'
  brace-expansion@<1.1.13: '>=1.1.13'
  brace-expansion@>=2.0.0 <2.0.3: '>=2.0.3'
  brace-expansion@>=5.0.0 <5.0.6: '>=5.0.6'
  dompurify@<3.4.7: '>=3.4.7'
  dompurify@<3.4.9: '>=3.4.9'
  dompurify@<=3.4.10: '>=3.4.11'
  dompurify@<=3.4.5: '>=3.4.6'
  dompurify@<=3.4.6: '>=3.4.7'
  dompurify@>=3.0.0 <=3.4.7: '>=3.4.8'
  flatted@<3.4.0: '>=3.4.0'
  flatted@<=3.4.1: '>=3.4.2'
  form-data@>=4.0.0 <4.0.6: '>=4.0.6'
  glob@>=10.2.0 <10.5.0: '>=10.5.0'
  handlebars@>=4.0.0 <4.7.9: '>=4.7.9'
  handlebars@>=4.0.0 <=4.7.8: '>=4.7.9'
  handlebars@>=4.6.0 <=4.7.8: '>=4.7.9'
  ip-address@<=10.1.0: '>=10.1.1'
  js-yaml@<3.14.2: '>=3.14.2'
  js-yaml@<=4.1.1: '>=4.2.0'
  lodash@<=4.17.23: '>=4.18.0'
  lodash@>=4.0.0 <=4.17.22: '>=4.17.23'
  lodash@>=4.0.0 <=4.17.23: '>=4.18.0'
  markdown-it@<12.3.2: '>=12.3.2'
  markdown-it@<=14.1.1: '>=14.2.0'
  minimatch@<3.1.3: '>=3.1.3'
  minimatch@<3.1.4: '>=3.1.4'
  minimatch@>=9.0.0 <9.0.6: '>=9.0.6'
  minimatch@>=9.0.0 <9.0.7: '>=9.0.7'
  # Keep the legacy 2.x consumers (readdirp@3 → '^2.2.1') on the 2.x line:
  # an unbounded '>=2.3.2' leaks up into the vulnerable 4.0.0–4.0.3 range,
  # which pnpm then won't re-bump (one override applied per package).
  picomatch@<2.3.2: '>=2.3.2 <3.0.0'
  picomatch@>=4.0.0 <4.0.4: '>=4.0.4'
  shell-quote@>=1.1.0 <=1.8.3: '>=1.8.4'
  undici@>=7.0.0 <7.18.2: '>=7.18.2'
  undici@>=7.0.0 <7.24.0: '>=7.24.0'
  undici@>=7.0.0 <7.28.0: '>=7.28.0'
  ws@>=8.0.0 <8.20.1: '>=8.20.1'
  ws@>=8.0.0 <8.21.0: '>=8.21.0'
